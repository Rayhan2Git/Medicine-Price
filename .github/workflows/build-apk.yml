name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'bd-medicine-app/mobile/package-lock.json'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci
        working-directory: bd-medicine-app/mobile

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build Android APK (Debug) using EAS
        run: eas build --platform android --local --profile preview
        working-directory: bd-medicine-app/mobile
        env:
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ./build-output
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bd-medicine-app/mobile/build-output/*.apk